; Example configuration for offline feed or Linux live AF_PACKET capture.
; The default live backend is recvmsg.
; Uncomment backend = tpacket_v3 to try the experimental PACKET_MMAP RX ring path.

[general]
min_saved_bytes_per_packet = 16

[capture]
backend = recvmsg
# backend = tpacket_v3
interface = eth0
promiscuous = false
default_snaplen = 65535
max_capture_len = 65535
max_packets = 0
duration_sec = 0
; Leave ring settings at defaults unless you are tuning tpacket_v3.
ring_block_size = 1048576
ring_block_count = 64
ring_frame_size = 2048
block_timeout_ms = 64
output = output.pcap

[tls]
enabled = true
ports = 443, 8443
app_data_keep_record_bytes = 256
app_data_continuation_keep_bytes = 64
app_data_continuation_policy = final_only

[quic]
enabled = true
ports = 443
short_header_keep_packet_bytes = 128
require_dcid_match = false
allow_short_header_without_known_dcid = true

[stats]
enabled = true
